<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login - Monitor Cajui</title>
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
    <div class="box">
        <h1>Entrar no Cajui</h1>
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
        <form method="POST" action="/login" id="form-login">
            <input type="text" name="usuario" placeholder="Usuário" autocomplete="username" autocapitalize="none" required>
            <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
            <button type="submit">Acessar Painel</button>
        </form>
        <p class="hint">Sua senha não é armazenada.</p>
    </div>
<script src="/static/pwa.js"></script>
<script src="/static/login.js"></script>
</body>
</html>
