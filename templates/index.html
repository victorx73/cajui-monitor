<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor Cajui</title>
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cajuí">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-limite="{{ limite }}">

<main class="container">
    <header class="header" id="header">
        <div class="topbar">
            <span class="brand">Monitor Cajui</span>
            <span class="topbar-right">
                <span class="updated" id="updated"></span>
                <a href="/logout" class="link-sair" id="sair">Sair</a>
            </span>
        </div>

        <section class="overview">
            <p class="overview-label">Frequência geral</p>
            <h1 class="overview-value" id="geral">--%</h1>

            <div class="overview-footer">
                <div class="status">
                    <span class="status-dot" id="dot"></span>
                    <span id="status-text">Carregando…</span>
                </div>
                <button type="button" class="btn-refresh" id="refresh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 7v5h-5M4 17v-5h5"/>
                        <path d="M5 9a7 7 0 0 1 12-3l3 3M4 15l3 3a7 7 0 0 0 12-3"/>
                    </svg>
                    <span id="refresh-label">Atualizar</span>
                </button>
            </div>
        </section>
    </header>

    <p class="note" id="note"></p>

    <section class="alert" id="alerta" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/>
        </svg>
        <span id="alerta-text"></span>
    </section>

    <section class="disciplines">
        <div class="section-header">
            <h2 class="section-title">Disciplinas</h2>
            <span class="section-count" id="count"></span>
        </div>
        <div class="subject-list" id="lista"><p class="empty">Carregando…</p></div>
    </section>

    <footer class="footer">Monitor Cajui · Controle de frequência</footer>
</main>

<script src="/static/pwa.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
