services:
  - type: web
    name: monitor-cajui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FERNET_KEY
        sync: false          # cole o valor no painel do Render
      - key: COOKIE_SECURE
        value: "true"
